    <meta name="theme-color" content="#07080a" />
    <script>
      // the saved look (services/theme.ts) before the first paint: no flash of the wrong theme
      (function () {
        var choice = "system";
        try { choice = localStorage.getItem("icmbot.theme") || "system"; } catch (e) {}
        var dark = choice === "dark" || (choice !== "light" && !(window.matchMedia && !matchMedia("(prefers-color-scheme: dark)").matches));
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
