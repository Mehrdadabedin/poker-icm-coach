name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: poker
          POSTGRES_PASSWORD: poker
          POSTGRES_DB: poker_icm_coach
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U poker -d poker_icm_coach"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync dependencies
        working-directory: backend
        run: uv sync
      - name: Lint
        working-directory: backend
        run: .venv/bin/ruff check app tests
      - name: Type check
        working-directory: backend
        run: .venv/bin/mypy app
      - name: Migrate
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://poker:poker@localhost:5433/poker_icm_coach
        run: .venv/bin/alembic upgrade head
      - name: Test
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://poker:poker@localhost:5433/poker_icm_coach
        run: .venv/bin/pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Unit tests
        working-directory: frontend
        run: npx vitest run
      - name: Build
        working-directory: frontend
        run: npm run build
